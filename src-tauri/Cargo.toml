[package]
name = "workbench"
version = "1.1.3"
description = "Workbench — multi-agent desktop host for Grok Build + Codex"
authors = ["Alxian"]
license = "MIT"
edition = "2021"

[lib]
name = "workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
which = "7"
chrono = { version = "0.4", features = ["serde", "clock"] }
async-trait = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
